# Cloudflare Worker configuration.
#
# `name` becomes part of your deployed URL:
#   https://<name>.<your-cloudflare-subdomain>.workers.dev
# Change it if you want, before your first `wrangler deploy` — renaming
# later creates a second, separate Worker rather than renaming this one.
name = "jee-edofox-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Needed because this Worker reuses the exact same `node:crypto` (AES-256-GCM
# encrypt/decrypt) and `cheerio` (HTML parsing) code that the original
# Firebase Cloud Function used, instead of rewriting it against Workers-only
# APIs. This flag polyfills the Node built-ins those two packages need.
compatibility_flags = ["nodejs_compat"]

# EDOFOX_ENC_KEY is set as a secret, NOT here — see DEPLOY.md.
# (Secrets don't go in wrangler.toml; `wrangler secret put` stores them
# encrypted, the same idea as `firebase functions:secrets:set` did before.)

# This Worker does not use KV, D1, R2, Durable Objects, or any other paid
# Cloudflare add-on — it only makes outbound `fetch()` calls to Edofox and
# uses Web Crypto / node:crypto for encryption, both included in every
# Workers plan including the free one.
